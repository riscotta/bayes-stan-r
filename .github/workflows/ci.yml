name: R CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read


jobs:
  pnad_n2:
    name: Python 3.12.8 — PNAD E10 public N2
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up fixed Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.8'

      - name: Verify exact interpreter and dependency scope
        shell: bash
        run: |
          python - <<'PY'
          import sys
          if sys.version_info[:3] != (3, 12, 8):
              raise SystemExit(f"Python N2 inesperado: {sys.version}")
          print("N2: Python 3.12.8 fixado; somente biblioteca padrão.")
          print("requirements-historicos.txt NÃO instalado: pacotes destinados a E04–E09/N3.")
          PY

      - name: Test public N2 and adversarial failures
        run: python -m unittest discover -s tests/python -p 'test_pnad_n2.py' -v

      - name: Verify T05.6 CI routing, dependencies and cost controls
        run: python -m unittest discover -s tests/python -p 'test_ci_t05_6.py' -v

      - name: Audit published PNAD E09 projection (N2 only)
        run: python .github/scripts/executar_auditoria_n2.py

  stan_syntax:
    name: Stan 2.40.0 — representative syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up fixed Python for gate tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.8'

      - name: Download pinned stanc3 and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/stan-dev/stanc3/releases/download/v2.40.0/linux-stanc \
            -o "$RUNNER_TEMP/stanc"
          echo "29306a35092c7f6c1aa20df903ddb9dcd83af5995ba37630324a2e019d05e6f4  $RUNNER_TEMP/stanc" | sha256sum --check
          chmod +x "$RUNNER_TEMP/stanc"
          "$RUNNER_TEMP/stanc" --version

      - name: Test structural gate and adversarial scenarios
        run: python -m unittest discover -s tests/python -p 'test_stan_t05_3.py' -v

      - name: Validate T05.4 and T05.5 scientific protocols without native sampling
        run: |
          python -m unittest discover -s tests/python -p 'test_stan_t05_4.py' -v
          python -m unittest discover -s tests/python -p 'test_stan_t05_5.py' -v

      - name: Compile representative Stan source to C++ (no native build or sampling)
        run: python .github/scripts/validar_stan_t05_3.py --stanc "$RUNNER_TEMP/stanc"

  validate:
    name: R 4.5.1 — syntax and tests
    needs: [pnad_n2, stan_syntax]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      R_PROFILE_USER: /dev/null
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

    steps:
      - name: Enforce Python public N2 before mandatory R check
        if: ${{ needs.pnad_n2.result != 'success' }}
        shell: bash
        run: |
          echo "::error::PNAD N2 Python não passou: check R obrigatório também deve falhar."
          exit 1

      - name: Enforce Stan source validation before mandatory R check
        if: ${{ needs.stan_syntax.result != 'success' }}
        shell: bash
        run: |
          echo "::error::Gate T05.3 Stan não passou: check R obrigatório também deve falhar."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up fixed R 4.5.1
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Verify R version
        run: |
          Rscript -e 'stopifnot(getRversion() == "4.5.1"); message("R ", getRversion())'

      - name: Install CI dependencies
        run: |
          Rscript -e 'install.packages("testthat", repos = Sys.getenv("RSPM", unset = "https://cloud.r-project.org"), Ncpus = 2L)'

      - name: Parse repository R files
        shell: Rscript {0}
        run: |
          files <- unlist(lapply(c("scripts", "tests"), function(root) {
            list.files(
              root,
              pattern = "\\.R$",
              recursive = TRUE,
              full.names = TRUE
            )
          }), use.names = FALSE)

          failures <- lapply(files, function(path) {
            tryCatch(
              {
                parse(file = path, keep.source = FALSE)
                NULL
              },
              error = function(e) {
                sprintf("%s: %s", path, conditionMessage(e))
              }
            )
          })

          failures <- Filter(Negate(is.null), failures)

          if (length(failures)) {
            stop(
              paste(
                "Falhas de sintaxe encontradas:",
                paste(unlist(failures), collapse = "\n"),
                sep = "\n"
              ),
              call. = FALSE
            )
          }

          message("Sintaxe válida em ", length(files), " arquivos R.")

      - name: Run structural tests
        run: Rscript tests/run_tests.R

      - name: Verify published Sao Paulo mortality indicators
        run: Rscript --vanilla scripts/mortalidade_sp_0_74/reproduzir_E10.R --modo=auditar

      - name: Summarize published scientific validity limits
        run: Rscript --vanilla scripts/_setup/report_scientific_gates.R
